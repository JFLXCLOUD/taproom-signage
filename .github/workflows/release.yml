name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Fire TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse the released player when native sources are unchanged
        id: player
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release view --json tagName --jq .tagName)
          if git diff --quiet "$previous" HEAD -- firetv/app firetv/build.gradle.kts firetv/settings.gradle.kts firetv/gradle.properties; then
            mkdir -p out previous-release
            gh release download "$previous" --pattern TaproomSignage-firetv.apk --dir out
            gh release download "$previous" --pattern SHA256SUMS.txt --dir previous-release
            expected=$(awk '$2 ~ /(^|\/)TaproomSignage-firetv.apk$/ {print $1}' previous-release/SHA256SUMS.txt)
            [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]
            echo "$expected  out/TaproomSignage-firetv.apk" | sha256sum --check
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing verified player from $previous; native sources have not changed."
          fi
      - uses: actions/setup-java@v4
        if: steps.player.outputs.reuse != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.player.outputs.reuse != 'true'
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        if: steps.player.outputs.reuse != 'true'
        with:
          gradle-version: '8.9'
      - name: assembleDebug
        if: steps.player.outputs.reuse != 'true'
        working-directory: firetv
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name it properly
        if: steps.player.outputs.reuse != 'true'
        run: |
          mkdir -p out
          # Keep this name stable: Downloader codes use releases/latest/download.
          cp firetv/app/build/outputs/apk/debug/app-debug.apk out/TaproomSignage-firetv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/TaproomSignage-firetv.apk

  windows:
    name: Windows server package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Build portable package
        run: node scripts/build-windows.mjs --setup --release-only
      - name: Verify installed service
        shell: powershell
        run: ./scripts/verify-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/TaproomSignage-win-x64.zip
            dist/TaproomSignage-Setup-win-x64.exe

  publish:
    name: Publish release
    needs: [apk, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Hash release downloads
        run: |
          cd assets
          cp windows/* apk/* .
          sha256sum *.exe *.zip *.apk > SHA256SUMS.txt
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            assets/apk/TaproomSignage-firetv.apk
            assets/windows/TaproomSignage-win-x64.zip
            assets/windows/TaproomSignage-Setup-win-x64.exe
            assets/SHA256SUMS.txt
      - name: Verify permanent Fire TV download URL
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
              "https://github.com/${{ github.repository }}/releases/latest/download/TaproomSignage-firetv.apk" \
              --output verified-firetv.apk && cmp --silent assets/apk/TaproomSignage-firetv.apk verified-firetv.apk; then
              echo "Permanent APK URL serves this release's APK."
              exit 0
            fi
            sleep 3
          done
          echo "Permanent APK URL did not resolve to this release's APK."
          exit 1
